# Bản chọn của rough_cut_v4 (E:\Film), chép từ build/build_rough_v4.py.
# Đường dẫn tương đối so với <Film>/assets/.
# - D08, D11: v4 dùng G-D08_web_take1 / G-D11_web_take1 (bản trên cloud). Trên đĩa không còn tên đó;
#   so khung 780 và 890 của rough_cut_v4_preview với từng take → khớp take6_OK (sai khác TB < 1/255).
# - Crop KHÔNG ghi ở đây: `aiprod qa` tự tính (cropdetect → cắt về 16:9, căn giữa), ra đúng
#   H01/H02 1840:1036:40:26, H03 1876:1056:22:16, E01 1764:992:78:48, còn lại 1920:1080:0:4.
# - Ảnh: lấy *_OK, nếu không có thì *_mjP7, nếu không có thì file duy nhất. D08/D11 có 3 ảnh _OK,
#   chưa rõ ảnh nào sinh ra take6 → tạm lấy mj1 (không ảnh hưởng bản dựng vì shot dùng clip).

